name: Owli GLB real-browser integration gate

on:
  pull_request:
    paths:
      - '.github/workflows/owli-browser-integration.yml'
      - 'apps/web/src/avatar/owli.ts'
      - 'apps/web/src/main.ts'
      - 'apps/web/tests/e2e/owli.spec.ts'
      - 'apps/web/tests/e2e/owli-harness.ts'
      - 'scripts/prepare-owli.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-glb-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLENDER_VERSION: '4.5.15'
      VITE_AVATAR_MODEL: 'owli'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned procedural Owli source
        uses: actions/checkout@v4
        with:
          repository: KreutzM/blender-fun
          ref: 29c8dfa60d38e00b70e86931ab97acbdd54bac3a
          path: blender-fun
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install GLB exporter dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libxi6 libxrender1 libxrandr2 libxinerama1 libxcursor1 libxkbcommon-x11-0
      - name: Download Blender 4.5.15 and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          getfile() {
            local file="$1" mirror
            for mirror in \
              "https://mirror.clarkson.edu/blender/release/Blender4.5" \
              "https://mirror.blender.org/release/Blender4.5" \
              "https://download.blender.org/release/Blender4.5"; do
              echo "Trying $mirror/$file"
              if curl -fLSs --retry 2 --retry-delay 3 --max-time 600 "$mirror/$file" -o "$file"; then return 0; fi
              rm -f "$file"
            done
            return 1
          }
          getfile "$archive"
          getfile "blender-${BLENDER_VERSION}.sha256"
          grep -F " $archive" "blender-${BLENDER_VERSION}.sha256" | head -n 1 | sha256sum -c -
          tar -xJf "$archive"
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" --version
      - name: Build own model GLB from pinned Blender sources
        shell: bash
        working-directory: blender-fun
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender-${BLENDER_VERSION}-linux-x64/blender" \
            --background --factory-startup --threads 4 --python scripts/export_owli_glb.py
          python3 scripts/check_owli_glb.py output/owli_glb
      - name: Import SHA-256 pinned model into ignored local test path
        run: python3 scripts/prepare-owli.py blender-fun/output/owli_glb/owli_avatar.glb
      - name: Install API and web test dependencies
        run: |
          python -m pip install 'uv==0.9.17'
          uv sync --project apps/api --frozen --extra dev
          cd apps/web
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build browser with Owli enabled
        working-directory: apps/web
        run: npm run build
      - name: Load real Owli GLB in Chromium and test mouth, eyes and UI
        working-directory: apps/web
        run: npx playwright test tests/e2e/owli.spec.ts
        env:
          CI: 'true'
          VITE_AVATAR_MODEL: 'owli'
      - name: Publish browser review screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owli-real-browser-review
          path: |
            apps/web/test-results/owli-real-browser.png
            apps/web/test-results/**/*.png
            apps/web/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 14

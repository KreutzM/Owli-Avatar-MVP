name: Generate bootstrap dependency locks
on:
  push:
    branches: [chore/bootstrap-codex-mvp]

permissions:
  contents: write

jobs:
  generate-lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'uv==0.9.17'
      - run: npm install --package-lock-only --no-audit --no-fund
        working-directory: apps/web
      - run: uv lock --project apps/api
      - name: Commit verified lockfiles on bootstrap branch
        run: |
          set -euo pipefail
          git add apps/web/package-lock.json apps/api/uv.lock
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: add resolved npm and uv dependency locks'
          git push origin HEAD:chore/bootstrap-codex-mvp

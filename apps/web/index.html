<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owli Avatar MVP</title>
  </head>
  <body>
    <main class="layout">
      <section class="stage">
        <div class="heading">
          <h1>Owli Avatar MVP</h1>
          <p>Vuena · 3D-Testmodell</p>
        </div>
        <div id="avatar" aria-label="3D-Avatar"></div>
        <span id="state" aria-live="polite">Status: idle</span>
      </section>
      <section class="dialogue" aria-label="Chat mit der Eule">
        <h2>Lokaler Textchat</h2>
        <p id="chat-mode">Chat-Modus wird ermittelt. Spracherkennung und TTS sind noch nicht integriert.</p>
        <div id="messages" role="log" aria-live="polite"></div>
        <form id="chat-form">
          <label for="message">Deine Nachricht</label>
          <textarea id="message" name="message" maxlength="1000" rows="3" required></textarea>
          <button id="send" type="submit">Absenden</button>
        </form>
        <label><input type="checkbox" id="speech-enabled" disabled /> Sprachausgabe aktivieren</label>
        <label for="volume">Lautstärke</label>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1" />
        <button id="stop-audio" type="button" disabled>Sprachausgabe stoppen</button>
        <p id="speech-status" role="status">Sprachausgabe wird geprüft.</p>
        <p id="notice" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

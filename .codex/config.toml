# Codex CLI project configuration. Actual availability is checked in-session.
model = "gpt-6.1-terra"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
# Non-interactive issue execution inside the existing workspace sandbox.
# Disallowed operations fail; this does not grant host or deployment access.
approval_policy = "never"

[sandbox_workspace_write]
# Existing project network policy; only issue-scoped, vetted accesses are allowed.
# This does not authorize installing packages or changing external services.
network_access = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

